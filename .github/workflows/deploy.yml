name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - v5
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config

      - name: Build Quartz
        run: npx quartz build

      - name: Inspect home page assets
        run: |
          python3 -c 'import re,pathlib; p=pathlib.Path("public/index.html"); s=p.read_text(); print("HOME_ASSETS", re.findall(r"(?:href|src)=\\\"([^\\\"]+)\\\"", s)[:30]); print("ROOT_FILES", [x.name for x in pathlib.Path("public").iterdir() if x.suffix in (".css", ".js")]); print("HOME_LINK", re.findall(r"<a[^>]*site-home[^>]*>", s))'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5